onboarding = false

[keys]
prefix = "ctrl+space"
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
previous_agent = "prefix+,"
next_agent = "prefix+."
focus_agent = "prefix+alt+1..9"
focus_pane_left = "shift+alt+left"
focus_pane_down = "shift+alt+down"
focus_pane_up = "shift+alt+up"
focus_pane_right = "shift+alt+right"
navigate_pane_left = "shift+alt+left"
navigate_pane_down = "shift+alt+down"
navigate_pane_up = "shift+alt+up"
navigate_pane_right = "shift+alt+right"

[theme]
name = "catppuccin"

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
